env_type: world_model
backend: code
task_suite_name: libero_goal
wm_env_type: libero

total_num_envs: null

auto_reset: False
ignore_terminations: False
max_steps_per_rollout_epoch: 240
max_episode_steps: 240 # max episode steps for truncation

use_rel_reward: True
reward_coef: 1.0

reset_gripper_open: True
is_eval: False

seed: 0
group_size: 1
use_fixed_reset_state_ids: True
use_ordered_reset_state_ids: False
specific_reset_id: null

video_cfg:
  save_video: True
  info_on_video: True
  video_base_dir: ${runner.logger.log_path}/video/train

enable_offload: False

###  ------------------Code WM params define here ------------------

# l0_oracle = OracleCodeEnv-Debug: original LIBERO scene + privileged init states.
# Plumbing only (plan §6.2); results from this mode are never method results.
code_mode: l1_world
num_steps_wait: 15        # same warmup as RLinf LiberoEnv.reset
check_init_frame: False   # L1: frame 0 comes from the world itself (session_frames hook)
init_frame_tol: 0.005     # max fraction of pixels changing by >25/255 vs the condition frame

enable_kir: False
initial_image_path: /data_cf/cowmpo/init/libero_goal_fit3   # fit-role trials 3-5 (splits_goal_v1); never gate3

chunk: 8                     # same as chunk in VLA
condition_frame_length: 5    # kept for the env's frame window; the world needs only the last frame
image_size: [256, 256]

reward_model:   # same RM as the Wan-Goal branch
  type: TaskEmbedResnetRewModel
  from_pretrained: /mnt/nfs/fjj/Models/RLinf-Wan-LIBERO-Goal/taskemb_resnet_rm.pth

# ---- L1 (plan 9.7-E): Builder world + S5 per-episode state + S6 runtime params; no LIBERO scene ----
world_dir: /data_cf/cowmpo/worlds/codex_s56_20261030_1020/bowl_support_dev_v1/world11   # G2 v2 passed (version d3e48451, bowl strike only)
state_dir: /data_cf/cowmpo/worlds/codex_s56_20261030_1020/s6_natural_v3/shape_states   # fit trials 0-5, estimated on world11
world_friction: {ceramic: 0.41143971716876265}   # G2 v2 nomination params
cowm_toolkits: /mnt/nfs/fjj/Code/CoWMPO/toolkits
