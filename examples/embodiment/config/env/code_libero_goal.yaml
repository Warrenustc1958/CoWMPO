env_type: world_model
backend: code
task_suite_name: libero_goal
wm_env_type: libero

total_num_envs: null

auto_reset: False
ignore_terminations: False
max_steps_per_rollout_epoch: 240
max_episode_steps: 240 # max episode steps for truncation

use_rel_reward: True
reward_coef: 1.0

reset_gripper_open: True
is_eval: False

seed: 0
group_size: 1
use_fixed_reset_state_ids: True
use_ordered_reset_state_ids: False
specific_reset_id: null

video_cfg:
  save_video: True
  info_on_video: True
  video_base_dir: ${runner.logger.log_path}/video/train

enable_offload: False

###  ------------------Code WM params define here ------------------

# l0_oracle = OracleCodeEnv-Debug: original LIBERO scene + privileged init states.
# Plumbing only (plan §6.2); results from this mode are never method results.
code_mode: l0_oracle
num_steps_wait: 15        # same warmup as RLinf LiberoEnv.reset
check_init_frame: True    # world frame must match the condition frame at open_session
init_frame_tol: 0.005     # max fraction of pixels changing by >25/255 vs the condition frame

enable_kir: False
initial_image_path: /data_cf/cowmpo/init/libero_goal_v1   # gen_init_dataset.py output + manifest.json

chunk: 8                     # same as chunk in VLA
condition_frame_length: 5    # kept for the env's frame window; the world needs only the last frame
image_size: [256, 256]

reward_model:   # same RM as the Wan-Goal branch
  type: TaskEmbedResnetRewModel
  from_pretrained: /mnt/nfs/fjj/Models/RLinf-Wan-LIBERO-Goal/taskemb_resnet_rm.pth
