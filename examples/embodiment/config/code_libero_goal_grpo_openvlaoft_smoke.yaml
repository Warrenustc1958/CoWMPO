# CoWM-PO S3 smoke test: OpenVLA-OFT GRPO inside the Code WM backend (code_mode l0_oracle).
# Goal: the loop runs (rollout -> shared RM reward -> GRPO update). Not a training result.
defaults:
  - env/code_libero_goal@env.train
  - env/libero_goal@env.eval
  - model/openvla_oft@actor.model
  - hybrid_engines/fsdp@actor.fsdp_config
  - weight_syncer/patch_syncer@weight_syncer
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    actor,env,rollout: 6-7

runner:
  task_type: embodied
  logger:
    log_path: "../results"
    project_name: cowmpo
    experiment_name: "code_libero_goal_grpo_smoke"
    logger_backends: ["tensorboard"]
  max_epochs: 1
  max_steps: 2
  only_eval: False
  val_check_interval: -1
  save_interval: -1
  resume_dir: null
  ckpt_path: null

algorithm:
  normalize_advantages: True
  kl_penalty: kl
  group_size: 2
  reward_type: action_level
  logprob_type: token_level
  entropy_type: token_level
  adv_type: grpo
  loss_type: actor
  loss_agg_func: "token-mean"
  kl_beta: 0.0
  entropy_bonus: 0
  clip_ratio_high: 0.28
  clip_ratio_low: 0.2
  clip_ratio_c: 3.0
  value_clip: 0.2
  huber_delta: 10.0
  gamma: 0.99
  gae_lambda: 0.95
  reward_coef: 5.0
  filter_rewards: False          # smoke test: do not drop all-equal groups, force an update

env:
  group_name: "EnvGroup"
  train:
    rollout_epoch: 1
    total_num_envs: 8
    group_size: ${algorithm.group_size}
    max_episode_steps: 192
    max_steps_per_rollout_epoch: 192
    reward_coef: ${algorithm.reward_coef}
    reset_gripper_open: True
    initial_image_path: /data_cf/cowmpo/init/libero_goal_smoke_hisr
  eval:
    rollout_epoch: 1
    total_num_envs: 2
    auto_reset: True
    ignore_terminations: True
    max_episode_steps: 192
    max_steps_per_rollout_epoch: 192
    group_size: 1
    reset_gripper_open: True
    is_eval: True
    video_cfg:
      save_video: False
      video_base_dir: ${runner.logger.log_path}/video/eval

rollout:
  sampling_params:
    do_sample: True
    temperature_train: 1.6
    temperature_eval: 1.6
    top_k: -1
    top_p: 1.0
    repetition_penalty: 1.0
  group_name: "RolloutGroup"
  generation_backend: "huggingface"
  enable_offload: True
  pipeline_stage_num: 1
  model:
    model_path: "/mnt/nfs/fjj/Models/Openvla-oft-SFT-libero-goal-traj1/"
    precision: ${actor.model.precision}

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: 4
  global_batch_size: 16
  seed: 1234
  enable_offload: True
  model:
    model_path: "/mnt/nfs/fjj/Models/Openvla-oft-SFT-libero-goal-traj1/"
    model_type: "openvla_oft"
    unnorm_key: libero_goal_no_noops
    max_prompt_length: 128
  optim:
    lr: 2.0e-5
    value_lr: 3.0e-3
    adam_beta1: 0.9
    adam_beta2: 0.999
    adam_eps: 1.0e-05
    weight_decay: 0.01
    clip_grad: 1.0
  fsdp_config:
    strategy: "fsdp"
    gradient_checkpointing: True
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: False
critic:
  use_critic_model: False
